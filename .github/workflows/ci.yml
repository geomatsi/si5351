name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  # Warnings are denied here rather than via #![deny(warnings)] in the crate,
  # so a future rustc lint breaks CI instead of every downstream user's build.
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: Build, test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo build --locked
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets
      # Catches broken intra-doc links.
      - run: cargo doc --locked --no-deps

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Must match rust-version in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo build --locked

  cross:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - thumbv6m-none-eabi
          - thumbv7m-none-eabi
          - thumbv7em-none-eabihf
          - riscv32imac-unknown-none-elf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --locked --target ${{ matrix.target }}

  # Since Cargo.lock is committed, the jobs above never see a new dependency
  # release. This one ignores the lockfile so a breaking upstream release shows
  # up here instead of in a user's build. Advisory: it does not gate merges.
  latest-deps:
    name: Latest dependencies
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo update
      - run: cargo build
      - run: cargo test
